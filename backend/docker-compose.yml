name: caravana

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: caravana
      POSTGRES_PASSWORD: caravana
      POSTGRES_DB: caravana
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caravana -d caravana']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
